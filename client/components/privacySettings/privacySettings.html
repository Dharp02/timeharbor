<template name="privacySettings">
  <div class="privacy-settings-container">
    <h3>Team Privacy Settings</h3>
    
    {{#if isTeamAdmin}}
      {{#if loading}}
        <p>Loading settings...</p>
      {{else}}
        <div class="settings-form">
          
          <!-- Privacy Level -->
          <div class="form-group">
            <label>Privacy Level</label>
            <select class="privacy-level-select">
              <option value="1" {{isSelected 1}}>Level 1: Categories Only (Maximum Privacy)</option>
              <option value="2" {{isSelected 2}}>Level 2: Show App Names</option>
              <option value="3" {{isSelected 3}}>Level 3: Detailed with Domain Filtering</option>
            </select>
            <p class="help-text">{{privacyLevelDescription}}</p>
          </div>
          
          <!-- Work Domains (Level 3 only) -->
          {{#if showDomainSettings}}
            <div class="form-group">
              <label>Work-Related Domains</label>
              <p class="help-text">Domains that will be shown to managers (one per line)</p>
              <textarea class="work-domains-input" rows="5" placeholder="github.com&#10;stackoverflow.com&#10;*.company.com">{{workDomainsText}}</textarea>
            </div>
            
            <div class="form-group">
              <label>Blocked Domains</label>
              <p class="help-text">Domains that will be hidden from reports (one per line)</p>
              <textarea class="blocked-domains-input" rows="5" placeholder="facebook.com&#10;instagram.com&#10;netflix.com">{{blockedDomainsText}}</textarea>
            </div>
          {{/if}}
          
          <!-- Cleanup Settings -->
          <div class="form-group">
            <label>Data Retention</label>
            <p>Delete raw activity data after: 
              <input type="number" class="cleanup-days-input" value="{{settings.autoCleanupDays}}" min="1" max="90" style="width: 60px;"> days
            </p>
            <p>Keep summaries for: 
              <input type="number" class="keep-summaries-input" value="{{settings.keepSummariesMonths}}" min="1" max="24" style="width: 60px;"> months
            </p>
          </div>
          
          <button class="btn btn-primary save-settings">Save Settings</button>
          
          {{#if saveSuccess}}
            <p class="success-message">✅ Settings saved successfully!</p>
          {{/if}}
          
        </div>
        
      {{/if}}
    {{else}}
      <p>Only team administrators can view these settings.</p>
    {{/if}}
  </div>
</template>
