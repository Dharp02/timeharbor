<template name="activityReport">
  <div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
      
      <!-- Header -->
      <div class="mb-8">
        <h2 class="text-3xl font-bold text-slate-800 mb-2">Activity Report</h2>
        <p class="text-slate-600">Track and analyze your productivity</p>
      </div>
      
      {{#if checkingConnection}}
        <div class="bg-white rounded-lg shadow-md p-8 text-center">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-500 mx-auto"></div>
          <p class="mt-4 text-slate-600">Checking ActivityWatch connection...</p>
        </div>
      {{else}}
        
        <!-- Connection Status -->
        <div class="mb-6">
          {{#if awConnected}}
            <div class="bg-emerald-50 border-l-4 border-emerald-500 p-4 rounded-r-lg">
              <div class="flex items-center">
                <svg class="h-6 w-6 text-emerald-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="font-semibold text-emerald-800">ActivityWatch Connected</span>
              </div>
            </div>
          {{else}}
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg">
              <div class="flex items-center">
                <svg class="h-6 w-6 text-red-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <div>
                  <span class="font-semibold text-red-800 block">ActivityWatch Not Running</span>
                  <span class="text-sm text-red-600">Please start ActivityWatch on your computer</span>
                </div>
              </div>
            </div>
          {{/if}}
        </div>
        
        {{#if awConnected}}
          
          <!-- Date Range Picker -->
          <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h3 class="text-lg font-semibold text-slate-800 mb-4">Select Time Period</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Start Date</label>
                <input type="date" 
                       class="start-date-input w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" 
                       value="{{startDate}}">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">End Date</label>
                <input type="date" 
                       class="end-date-input w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" 
                       value="{{endDate}}">
              </div>
              <div class="flex items-end">
                <button class="generate-report w-full bg-gradient-to-r from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition duration-200 transform hover:scale-105">
                  {{#if generatingReport}}
                    <span class="flex items-center justify-center">
                      <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                      </svg>
                      Generating...
                    </span>
                  {{else}}
                    Generate Report
                  {{/if}}
                </button>
              </div>
            </div>
          </div>
          
          {{#if currentReport}}
            
            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
              
              <!-- Total Hours Card -->
              <div class="bg-gradient-to-br from-purple-500 to-purple-600 rounded-lg shadow-lg p-6 text-white">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="text-purple-100 text-sm font-medium">Total Hours</p>
                    <p class="text-4xl font-bold mt-2">{{totalHours}}</p>
                  </div>
                  <svg class="h-12 w-12 text-purple-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                </div>
              </div>
              
              <!-- Apps Count Card -->
              <div class="bg-gradient-to-br from-cyan-500 to-cyan-600 rounded-lg shadow-lg p-6 text-white">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="text-cyan-100 text-sm font-medium">Apps Used</p>
                    <p class="text-4xl font-bold mt-2">{{appsCount}}</p>
                  </div>
                  <svg class="h-12 w-12 text-cyan-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
                  </svg>
                </div>
              </div>
              
              <!-- Date Range Card -->
              <div class="bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-lg shadow-lg p-6 text-white">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="text-emerald-100 text-sm font-medium">Date Range</p>
                    <p class="text-sm font-semibold mt-2">{{dateRange}}</p>
                  </div>
                  <svg class="h-12 w-12 text-emerald-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                  </svg>
                </div>
              </div>
              
            </div>
            
            <!-- Charts Row -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
              
              <!-- Application Usage Pie Chart -->
              <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-semibold text-slate-800 mb-4">Application Usage</h3>
                <div class="w-full" style="height: 300px;">
                  <canvas id="apps-pie-chart"></canvas>
                </div>
              </div>
              
              <!-- Browser Activity Pie Chart -->
              <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-semibold text-slate-800 mb-4">Browser Activity</h3>
                <div class="w-full" style="height: 300px;">
                  {{#if hasWebsites}}
                    <canvas id="websites-pie-chart"></canvas>
                  {{else}}
                    <div class="flex items-center justify-center h-full text-slate-400">
                      <div class="text-center">
                        <svg class="h-16 w-16 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path>
                        </svg>
                        <p>No browser activity recorded</p>
                      </div>
                    </div>
                  {{/if}}
                </div>
              </div>
              
            </div>

            <!-- Daily Activity Bar Chart -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
              <h3 class="text-lg font-semibold text-slate-800 mb-4">Daily Activity (Apps)</h3>
              <div class="w-full" style="height: 300px;">
                <canvas id="bar-chart"></canvas>
              </div>
            </div>
            
            <!-- Detailed Breakdown Table -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
              <h3 class="text-lg font-semibold text-slate-800 mb-4">Detailed Breakdown</h3>
              <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                  <thead class="bg-slate-50">
                    <tr>
                      <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider w-12"></th>
                      <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">App / File / Website</th>
                      <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Hours</th>
                      <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Percentage</th>
                    </tr>
                  </thead>
                  <tbody class="bg-white divide-y divide-slate-200">
                    {{#each appsWithIndex}}
                      <tr class="app-row hover:bg-slate-50 cursor-pointer" data-app-index="{{appIndex}}">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">
                          {{#if hasItems}}
                            <svg class="expand-icon h-5 w-5 text-slate-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                          {{/if}}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                          <div class="flex items-center justify-between">
                            <div class="flex items-center">
                              <span class="text-sm font-semibold text-slate-900">{{name}}</span>
                              <span class="ml-2 px-2 py-1 text-xs rounded-full bg-slate-100 text-slate-600">{{category}}</span>
                            </div>
                            <div class="relative app-menu-container">
                              <button class="app-menu-btn p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" 
                                      data-app-name="{{name}}"
                                      data-app-index="{{appIndex}}"
                                      title="Options">
                                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                                  <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path>
                                </svg>
                              </button>
                              <div class="app-menu-dropdown hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-slate-200 z-10">
                                <button class="delete-app-btn w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg flex items-center gap-2"
                                        data-app-name="{{name}}"
                                        data-app-index="{{appIndex}}">
                                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                  </svg>
                                  Delete entire app
                                </button>
                              </div>
                            </div>
                          </div>
                        </td>

                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900 font-medium">{{hours}}h</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">
                          <div class="flex items-center">
                            <div class="w-16 bg-slate-200 rounded-full h-2 mr-2">
                              <div class="bg-purple-500 h-2 rounded-full" style="width: {{percentage}}%"></div>
                            </div>
                            <span>{{percentage}}%</span>
                          </div>
                        </td>
                      </tr>
                      
                     {{#each items}}
                      <tr class="nested-item-row hidden" data-parent-app="{{../appIndex}}">
                        <td class="px-6 py-3 whitespace-nowrap"></td>
                        <td class="px-6 py-3">
                          <div class="pl-8 flex items-center justify-between">
                            <div class="flex items-center flex-1">
                              <svg class="h-4 w-4 text-slate-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                              </svg>
                              <div class="flex-1">
                                <div class="text-sm text-slate-700 font-medium">{{name}}</div>
                                {{#if timeRanges}}
                                  <div class="text-xs text-slate-500 mt-1 space-y-0.5">
                                    {{#each timeRanges}}
                                      <div class="flex items-center gap-2">
                                        <svg class="h-3 w-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                        </svg>
                                        <span>{{start}} - {{end}}</span>
                                        <span class="text-slate-400">({{duration}}min)</span>
                                      </div>
                                    {{/each}}
                                  </div>
                                {{/if}}
                              </div>
                            </div>

                            <!-- X button for individual items (ALWAYS inside the flex container) -->
                            <button class="delete-activity-btn ml-3 p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors duration-200 flex-shrink-0"
                                    data-activity-name="{{name}}"
                                    data-domain="{{domain}}"
                                    data-parent-app="{{../name}}"
                                    title="Delete this activity">
                              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M6 18L18 6M6 6l12 12"></path>
                              </svg>
                            </button>
                          </div>
                        </td>

                        <td class="px-6 py-3 whitespace-nowrap text-sm text-slate-600">
                          <div>
                            <div class="font-medium">{{hours}}h</div>
                            <div class="text-xs text-slate-500">{{minutes}}min</div>
                          </div>
                        </td>
                        <td class="px-6 py-3 whitespace-nowrap text-sm text-slate-500">
                          <div class="flex items-center">
                            <div class="w-12 bg-slate-200 rounded-full h-1.5 mr-2">
                              <div class="bg-cyan-500 h-1.5 rounded-full" style="width: {{percentage}}%"></div>
                            </div>
                            <span class="text-xs">{{percentage}}%</span>
                          </div>
                        </td>
                      </tr>
                    {{/each}}
                    {{/each}}
                  </tbody>
                </table>
              </div>
            </div>
          {{/if}}
        {{/if}}
      {{/if}}
    </div>
  </div>
</template>
